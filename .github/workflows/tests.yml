name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the project and test dependencies
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Verify modules compile
        run: python -m compileall -q phishguard main.py
      - name: Audit dependencies
        run: python -m pip_audit --skip-editable
      - name: Run static security checks
        run: python -m bandit -q -r phishguard main.py
