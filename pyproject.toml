[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
dynamic = ["version"]
description = "Explainable phishing-email triage for SOC analysts."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Gursimran Singh"}]
dependencies = [
    "requests==2.34.2",
    "dnspython==2.6.1",
    "tldextract>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.9",
    "pip-audit>=2.10.1",
    "pytest>=7.4",
    "pytest-cov>=5.0",
]

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools.dynamic]
version = {attr = "phishguard.__version__"}

[tool.setuptools.packages.find]
include = ["phishguard*"]
namespaces = false

[tool.setuptools.package-data]
phishguard = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
