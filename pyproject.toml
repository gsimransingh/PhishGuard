[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
dynamic = ["version"]
description = "Explainable phishing-email triage for SOC analysts."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Gursimran Singh"}]
dependencies = [
    "requests==2.34.2",
    # CVE-2026-114605 (excessive CPU use in dns.name.from_wire_parser) affects
    # every dnspython below 2.9.0, and 2.9.0 requires Python 3.11+. Python 3.10
    # is still supported here, so it gets the newest version that installs at
    # all and the advisory stands there; see README's design limitations.
    "dnspython==2.9.1; python_version >= '3.11'",
    "dnspython==2.8.0; python_version < '3.11'",
    "tldextract>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.9",
    "pip-audit>=2.7.3",
    "pytest>=7.4",
    "pytest-cov>=5.0",
]

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools.dynamic]
version = {attr = "phishguard.__version__"}

[tool.setuptools.packages.find]
include = ["phishguard*"]
namespaces = false

[tool.setuptools.package-data]
phishguard = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
