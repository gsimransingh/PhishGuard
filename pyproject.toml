[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
dynamic = ["version"]
description = "Explainable phishing-email triage for SOC analysts."
readme = "README.md"
# Python 3.10 reached end of life on 2026-10-01 and is dropped here, because
# supporting it would mean shipping a vulnerable dependency: the fix for
# CVE-2026-114605 is dnspython 2.9.0, which requires Python >= 3.11, and the
# newest dnspython that still supports 3.10 is 2.8.0, which carries the CVE.
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Gursimran Singh"}]
# Floors, not exact pins: an exact pin on a transitive-free dependency means a
# security release needs a code change to reach users, and dnspython 2.6.1 sat
# on CVE-2026-114605 long enough for CI's own pip-audit gate to fail.
dependencies = [
    "requests>=2.34.2",
    "dnspython>=2.9.1",
    "tldextract>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.9",
    "pip-audit>=2.7.3",
    "pytest>=7.4",
    "pytest-cov>=5.0",
]

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools.dynamic]
version = {attr = "phishguard.__version__"}

[tool.setuptools.packages.find]
include = ["phishguard*"]
namespaces = false

[tool.setuptools.package-data]
phishguard = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
