[pytest]
minversion = 7.0
; Ensures the project root is on sys.path so "from phishguard.x import y"
; works regardless of how pytest is invoked (bare `pytest`, `python -m pytest`,
; from an IDE, etc). Without this, only `python -m pytest` from the repo
; root would reliably resolve the phishguard package.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
